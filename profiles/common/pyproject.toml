[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-sim-profiles"
version = "0.4.0.dev0"
description = "Isolated robosuite and LIBERO profile runners for Semantic MuJoCo"
requires-python = ">=3.8,<3.13"
dependencies = [
  "fastapi==0.115.0",
  "Pillow==10.4.0; python_version < '3.10'",
  "Pillow==11.2.1; python_version >= '3.10'",
  "PyYAML==6.0.2",
  "semantic-mujoco-visuals",
  "uvicorn==0.30.6",
  "websockets==13.0.1",
]

[project.scripts]
semantic-sim-profile = "semantic_sim_profiles.cli:main"
semantic-sim-runtime = "semantic_sim_profiles.runtime_api:main"

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_sim_profiles"]

[tool.uv]
package = true

[tool.uv.sources]
semantic-mujoco-visuals = { path = "../../packages/mujoco-visuals", editable = false }

[dependency-groups]
dev = [
  "numpy==1.22.4; python_version < '3.9'",
  "numpy==1.26.4; python_version >= '3.9'",
  "pytest==8.3.5; python_version >= '3.9'",
  "pytest==7.4.4; python_version < '3.9'",
  "ruff==0.11.12; python_version >= '3.9'",
  "httpx==0.28.1",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
