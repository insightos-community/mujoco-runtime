[project]
name = "semantic-mujoco-robosuite-profile"
version = "0.4.0.dev0"
description = "隔离运行的 robosuite 1.5 演示环境"
requires-python = ">=3.10,<3.13"
dependencies = [
  "numpy==1.26.4",
  "mujoco==3.4.0",
  "robosuite==1.5.2",
  "semantic-sim-profiles",
]

[tool.uv]
package = false

[tool.uv.sources]
semantic-sim-profiles = { path = "../common", editable = false }

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.12",
]

[tool.ruff]
line-length = 100
target-version = "py310"
