[project]
name = "semantic-mujoco-libero-profile"
version = "0.4.0.dev0"
description = "隔离运行的 LIBERO 与 LIBERO-Pro 演示环境"
requires-python = ">=3.8,<3.9"
dependencies = [
  "bddl==1.0.1",
  "cloudpickle==2.1.0",
  "easydict==1.9",
  "gym==0.25.2",
  "hydra-core==1.2.0",
  "future==0.18.2",
  "matplotlib==3.5.3",
  "numpy==1.22.4",
  "opencv-python-headless==4.6.0.66",
  "robosuite==1.4.0",
  "semantic-sim-profiles",
  "torch==1.13.1",
  "termcolor==2.4.0",
]

[tool.uv]
package = false

[tool.uv.sources]
semantic-sim-profiles = { path = "../common", editable = false }

[dependency-groups]
dev = [
  "pytest==8.3.5",
  "ruff==0.11.12",
]

[tool.ruff]
line-length = 100
target-version = "py38"
