[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-mujoco-visuals"
version = "0.4.0.dev0"
description = "Shared MuJoCo model to GLB exporter for Semantic simulation runtimes"
requires-python = ">=3.8,<3.14"
dependencies = [
  "numpy==1.22.4; python_version < '3.9'",
  "numpy==1.26.4; python_version >= '3.9' and python_version < '3.13'",
  "numpy==2.3.5; python_version >= '3.13'",
]

[tool.hatch.build.targets.wheel]
packages = ["src/semantic_mujoco_visuals"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
