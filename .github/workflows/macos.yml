name: Native macOS
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      graphics:
        description: Run graphics qualification on a registered semantic-graphics Mac
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  native:
    name: Native CPU, API and package build
    runs-on: macos-15
    timeout-minutes: 30
    env:
      MUJOCO_GL: cgl
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
          enable-cache: true
      - name: Verify native architecture and install locked environment
        run: |
          test "$(uname -m)" = arm64
          uv sync --frozen --python 3.13.15 --extra dev
      - name: Test API and platform defaults
        run: |
          uv run --frozen ruff check src/plugin_mujoco/settings.py src/plugin_mujoco/models.py tests/test_settings.py tests/test_native_smoke.py tools/macos_smoke.py
          uv run --frozen pytest -p pytest_cov -m 'not native' --cov=plugin_mujoco --cov-report=term-missing --cov-report=xml
      - name: Exercise native physics (hosted runner has no usable CGL)
        run: uv run --frozen python tools/macos_smoke.py --physics-only --output .output/macos-report.json
      - name: Build Python packages
        run: |
          uv build
          uv build --project packages/mujoco-visuals --out-dir dist
      - name: Upload packages and native validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: mujoco-runtime-macos-arm64
          path: |
            dist/*
            .output/macos-report.json
            coverage.xml
          if-no-files-found: error
          retention-days: 14
  graphics:
    name: Physical Mac CGL and pallet scene qualification
    if: github.event_name == 'workflow_dispatch' && inputs.graphics
    runs-on: [self-hosted, macOS, ARM64, semantic-graphics]
    timeout-minutes: 30
    env:
      MUJOCO_GL: cgl
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: 0.12.12
      - run: uv sync --frozen --python 3.13.15 --extra dev
      - name: Require working native CGL rendering
        run: uv run --frozen python tools/macos_smoke.py --output .output/macos-graphics-report.json
      - name: Check out pinned simulation assets
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: insightos-community/mujoco-asset
          ref: f9855e6dd1419f890b418a9f398bd1d5ec49b57c
          path: .macos-assets
          lfs: true
          persist-credentials: false
      - name: Run the real pallet scene on native macOS
        env:
          MUJOCO_ASSET_ROOT: ${{ github.workspace }}/.macos-assets
        run: uv run --frozen pytest tests/test_native_smoke.py -vv
      - name: Upload graphics qualification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-arm64-graphics-evidence
          path: .output/macos-graphics-report.json
          if-no-files-found: error
