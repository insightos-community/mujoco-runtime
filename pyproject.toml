[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "semantic-plugin-mujoco"
version = "0.4.0.dev0"
description = "Semantic standalone MuJoCo runtime and virtual Robot SDK"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "fastapi==0.115.12",
  "mujoco==3.4.0",
  "numpy==1.26.4; python_version < '3.13'",
  "numpy==2.3.5; python_version >= '3.13'",
  "Pillow==11.2.1",
  # Native macOS 3.13 installers share the Robot Skill dependency set.
  "pydantic==2.13.4; sys_platform != 'linux' and python_version >= '3.13'",
  "pydantic==2.11.5; sys_platform == 'linux' or python_version < '3.13'",
  "PyYAML==6.0.2",
  "semantic-mujoco-visuals",
  "uvicorn[standard]==0.34.3",
]

[tool.uv.sources]
semantic-mujoco-visuals = { path = "packages/mujoco-visuals", editable = false }

[project.optional-dependencies]
dev = [
  "build==1.2.2.post1",
  "httpx==0.28.1",
  "pytest==8.3.5",
  "pytest-cov==6.1.1",
  "ruff==0.11.12",
]

[project.scripts]
plugin-mujoco = "plugin_mujoco.main:run"
plugin-mujoco-demo = "plugin_mujoco.testing.demo:run"

[tool.hatch.build.targets.wheel]
packages = ["src/plugin_mujoco"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider --strict-markers -ra"
testpaths = ["tests"]
# 根单测门禁需要验证 profiles/common 的独立 Runtime 服务（无场景源码即可 ready）。
# 该包属于独立锁文件的项目，与根环境的 fastapi/uvicorn 版本不同，不能作为根依赖安装，
# 因此按源码路径加入，保证 uv sync --frozen --extra dev 之后仍可导入。
pythonpath = ["profiles/common/src"]
markers = [
  "native: requires a real MuJoCo installation and asset repository",
  "process: starts the API server or a runtime thread",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.coverage.run]
source = ["plugin_mujoco"]
omit = [
  "src/plugin_mujoco/main.py",
  "src/plugin_mujoco/native/*",
]

[tool.coverage.report]
show_missing = true
fail_under = 75
